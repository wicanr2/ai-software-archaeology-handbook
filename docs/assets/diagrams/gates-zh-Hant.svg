<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc"><title id="title">規格閘門：何時可以實作</title><desc id="desc">規格閘門：何時可以實作 — 實線：工作推進　　虛線：帶著反例回查；不是自動升級信心</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#397880" stroke-width="1.5"/></marker></defs><rect width="1000" height="350" fill="white"/><g font-family="Noto Sans CJK TC,sans-serif"><text x="28" y="42" font-size="29" font-weight="700" text-anchor="start" fill="#142e4a">規格閘門：何時可以實作</text><path d="M28 61 H972" stroke="#0d9488" stroke-width="3"/><rect x="28" y="125" width="254" height="120" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="155.0" y="187.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">DRAFT</text><text x="155.0" y="219.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">蒐證與隔離原型</text><rect x="373" y="125" width="254" height="120" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="500.0" y="187.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">READY</text><text x="500.0" y="219.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">範圍內正式實作</text><rect x="718" y="125" width="254" height="120" rx="14" fill="#142e4a" stroke="#b6d7da"/><text x="845.0" y="187.0" font-size="23" font-weight="700" text-anchor="middle" fill="#ffffff">CONFORMED</text><text x="845.0" y="219.0" font-size="16" font-weight="400" text-anchor="middle" fill="#ffffff">引用有範圍的結果</text><path d="M282 180 H365" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><text x="326" y="103" font-size="17" font-weight="400" text-anchor="middle" fill="#344b60">證據審查</text><path d="M627 180 H710" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><text x="671" y="103" font-size="17" font-weight="400" text-anchor="middle" fill="#344b60">必要比較通過</text><text x="28" y="305" font-size="19" font-weight="400" text-anchor="start" fill="#344b60">規格狀態 ≠ 主張信心；新證據或版本變更須重審受影響範圍。</text></g></svg>