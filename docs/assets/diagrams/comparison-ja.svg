<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc"><title id="title">差分検証：欠測は合格ではない</title><desc id="desc">差分検証：欠測は合格ではない — 実線：作業の進行　破線：反例をもとに再調査。確信度の自動昇格ではない。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#397880" stroke-width="1.5"/></marker></defs><rect width="1000" height="465" fill="white"/><g font-family="Noto Sans CJK JP,sans-serif"><text x="28" y="42" font-size="29" font-weight="700" text-anchor="start" fill="#142e4a">差分検証：欠測は合格ではない</text><path d="M28 61 H972" stroke="#0d9488" stroke-width="3"/><rect x="28" y="82" width="420" height="85" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="238.0" y="126.5" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">参照の観測</text><text x="238.0" y="158.5" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">版・初期状態・入力を固定</text><rect x="552" y="82" width="420" height="85" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="762.0" y="126.5" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">候補の観測</text><text x="762.0" y="158.5" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">版・初期状態・入力を固定</text><path d="M238 167 V187 H430 V206" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M762 167 V187 H570 V206" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="210" y="215" width="580" height="80" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="500.0" y="257.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">検査点・時点・項目を整合</text><text x="500.0" y="289.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">審査済みの契約に従って比較</text><path d="M500 295 V317 H170 V336" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="345" width="284" height="90" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="170.0" y="392.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">厳密な一致／許容差</text><text x="170.0" y="424.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">範囲と許容差を別々に報告</text><path d="M500 295 V317 H500 V336" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="358" y="345" width="284" height="90" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="500.0" y="392.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">不一致</text><text x="500.0" y="424.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">最初の分岐を保存</text><path d="M500 295 V317 H830 V336" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="688" y="345" width="284" height="90" rx="14" fill="#142e4a" stroke="#b6d7da"/><text x="830.0" y="392.0" font-size="23" font-weight="700" text-anchor="middle" fill="#ffffff">欠測／比較不能／スキップ</text><text x="830.0" y="424.0" font-size="16" font-weight="400" text-anchor="middle" fill="#ffffff">必須項目は合格に数えない</text></g></svg>