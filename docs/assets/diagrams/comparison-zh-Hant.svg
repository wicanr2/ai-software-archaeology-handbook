<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc"><title id="title">差分驗證：缺失不等於通過</title><desc id="desc">差分驗證：缺失不等於通過 — 實線：工作推進　　虛線：帶著反例回查；不是自動升級信心</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#397880" stroke-width="1.5"/></marker></defs><rect width="1000" height="465" fill="white"/><g font-family="Noto Sans CJK TC,sans-serif"><text x="28" y="42" font-size="29" font-weight="700" text-anchor="start" fill="#142e4a">差分驗證：缺失不等於通過</text><path d="M28 61 H972" stroke="#0d9488" stroke-width="3"/><rect x="28" y="82" width="420" height="85" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="238.0" y="126.5" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">參考觀測</text><text x="238.0" y="158.5" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">固定版本、起始狀態與輸入</text><rect x="552" y="82" width="420" height="85" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="762.0" y="126.5" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">候選觀測</text><text x="762.0" y="158.5" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">固定版本、起始狀態與輸入</text><path d="M238 167 V187 H430 V206" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M762 167 V187 H570 V206" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="210" y="215" width="580" height="80" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="500.0" y="257.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">對齊檢查點、時點與欄位</text><text x="500.0" y="289.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">依預先審查的契約比較</text><path d="M500 295 V317 H170 V336" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="345" width="284" height="90" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="170.0" y="392.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">精確相符／容許差異</text><text x="170.0" y="424.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">分開報告範圍與容差</text><path d="M500 295 V317 H500 V336" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="358" y="345" width="284" height="90" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="500.0" y="392.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">不相符</text><text x="500.0" y="424.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">保存第一個分歧</text><path d="M500 295 V317 H830 V336" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="688" y="345" width="284" height="90" rx="14" fill="#142e4a" stroke="#b6d7da"/><text x="830.0" y="392.0" font-size="23" font-weight="700" text-anchor="middle" fill="#ffffff">缺失／不可比較／略過</text><text x="830.0" y="424.0" font-size="16" font-weight="400" text-anchor="middle" fill="#ffffff">必要項不得計為通過</text></g></svg>