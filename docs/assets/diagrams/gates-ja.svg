<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc"><title id="title">仕様のゲート：実装を始める条件</title><desc id="desc">仕様のゲート：実装を始める条件 — 実線：作業の進行　破線：反例をもとに再調査。確信度の自動昇格ではない。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#397880" stroke-width="1.5"/></marker></defs><rect width="1000" height="350" fill="white"/><g font-family="Noto Sans CJK JP,sans-serif"><text x="28" y="42" font-size="29" font-weight="700" text-anchor="start" fill="#142e4a">仕様のゲート：実装を始める条件</text><path d="M28 61 H972" stroke="#0d9488" stroke-width="3"/><rect x="28" y="125" width="254" height="120" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="155.0" y="187.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">DRAFT</text><text x="155.0" y="219.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">証拠収集と隔離した試作</text><rect x="373" y="125" width="254" height="120" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="500.0" y="187.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">READY</text><text x="500.0" y="219.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">範囲内の正式実装</text><rect x="718" y="125" width="254" height="120" rx="14" fill="#142e4a" stroke="#b6d7da"/><text x="845.0" y="187.0" font-size="23" font-weight="700" text-anchor="middle" fill="#ffffff">CONFORMED</text><text x="845.0" y="219.0" font-size="16" font-weight="400" text-anchor="middle" fill="#ffffff">範囲を限定した結果の引用</text><path d="M282 180 H365" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><text x="326" y="103" font-size="17" font-weight="400" text-anchor="middle" fill="#344b60">証拠の審査</text><path d="M627 180 H710" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><text x="671" y="103" font-size="17" font-weight="400" text-anchor="middle" fill="#344b60">必須の比較に合格</text><text x="28" y="305" font-size="19" font-weight="400" text-anchor="start" fill="#344b60">仕様の状態 ≠ 主張の確信度。新しい証拠や版は影響範囲の再審査を要する。</text></g></svg>