<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">証拠から適合性へ</title><desc id="desc">証拠から適合性へ — 実線：作業の進行　破線：反例をもとに再調査。確信度の自動昇格ではない。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#397880" stroke-width="1.5"/></marker></defs><rect width="1000" height="440" fill="white"/><g font-family="Noto Sans CJK JP,sans-serif"><text x="28" y="42" font-size="29" font-weight="700" text-anchor="start" fill="#142e4a">証拠から適合性へ</text><path d="M28 61 H972" stroke="#0d9488" stroke-width="3"/><rect x="28" y="85" width="209" height="100" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="44" y="112" font-size="16" font-weight="700" text-anchor="start" fill="#217c77">01</text><text x="132.5" y="137.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">証拠</text><text x="132.5" y="169.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">生の観測と来歴</text><rect x="273" y="85" width="209" height="100" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="289" y="112" font-size="16" font-weight="700" text-anchor="start" fill="#217c77">02</text><text x="377.5" y="137.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">仮説</text><text x="377.5" y="169.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">区別できる候補の予測</text><rect x="518" y="85" width="209" height="100" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="534" y="112" font-size="16" font-weight="700" text-anchor="start" fill="#217c77">03</text><text x="622.5" y="137.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">仕様</text><text x="622.5" y="169.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">入力・状態・受入条件</text><rect x="763" y="85" width="209" height="100" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="779" y="112" font-size="16" font-weight="700" text-anchor="start" fill="#217c77">04</text><text x="867.5" y="137.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">判定基準</text><text x="867.5" y="169.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">条件を固定した参照観測</text><rect x="763" y="210" width="209" height="100" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="779" y="237" font-size="16" font-weight="700" text-anchor="start" fill="#217c77">05</text><text x="867.5" y="262.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">実装</text><text x="867.5" y="294.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">READY の範囲のみ</text><rect x="518" y="210" width="209" height="100" rx="14" fill="#edf6f7" stroke="#b6d7da"/><text x="534" y="237" font-size="16" font-weight="700" text-anchor="start" fill="#217c77">06</text><text x="622.5" y="262.0" font-size="23" font-weight="700" text-anchor="middle" fill="#142e4a">差分検証</text><text x="622.5" y="294.0" font-size="16" font-weight="400" text-anchor="middle" fill="#142e4a">項目別の比較と網羅範囲</text><rect x="273" y="210" width="209" height="100" rx="14" fill="#142e4a" stroke="#b6d7da"/><text x="289" y="237" font-size="16" font-weight="700" text-anchor="start" fill="#86c9c4">07</text><text x="377.5" y="262.0" font-size="23" font-weight="700" text-anchor="middle" fill="#ffffff">適合性</text><text x="377.5" y="294.0" font-size="16" font-weight="400" text-anchor="middle" fill="#ffffff">版と声明の範囲を限定</text><path d="M237 135 H267" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M482 135 H512" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M727 135 H757" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M867 185 V204" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M763 260 H736" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M518 260 H491" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M622 310 V340 H90 V197" fill="none" stroke="#397880" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="125" y="380" font-size="20" font-weight="400" text-anchor="start" fill="#344b60">矛盾や証拠の不足 → 影響する証拠と仕様を再調査</text><text x="28" y="417" font-size="17" font-weight="400" text-anchor="start" fill="#344b60">実線：作業の進行　破線：反例をもとに再調査。確信度の自動昇格ではない。</text></g></svg>